name: JuhudManager V2 - Build & Test

on:
  push:
    branches:
      - integration/v1-v2-separation-develop
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juhudmanager-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Run V2 Tests and Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Run Wrangler build dry-run
        run: npm run build
