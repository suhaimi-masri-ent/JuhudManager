
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'unsafe-inline'; connect-src 'self' https://juhudmanager-v2-api.bitsuhami.workers.dev; style-src 'unsafe-inline';">
  <title>JuhudManager V2 - CORS Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 16px;
      line-height: 1.5;
    }
    button {
      padding: 12px 18px;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eee;
      color: #111;
      padding: 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h2>JuhudManager V2 API Test</h2>
  <p>Tests API connectivity and browser CORS preflight.</p>

  <button id="runTest">Run Test</button>
  <pre id="result">Ready.</pre>

  <script>
    const API =
      "https://juhudmanager-v2-api.bitsuhami.workers.dev";

    const output = document.getElementById("result");
    const button = document.getElementById("runTest");

    button.addEventListener("click", async () => {
      button.disabled = true;
      output.textContent = "Running tests...\n";

      try {
        const health = await fetch(API + "/health");
        const healthData = await health.json();

        output.textContent +=
          "GET /health: HTTP " + health.status + "\n" +
          JSON.stringify(healthData, null, 2) + "\n\n";

        const probe = await fetch(API + "/__cors_probe__", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ test: true })
        });

        const probeText = await probe.text();

        output.textContent +=
          "POST /__cors_probe__: HTTP " + probe.status + "\n" +
          probeText + "\n\n" +
          "CORS: Browser successfully received API response.";

      } catch (error) {
        output.textContent +=
          "\nTEST FAILED\n" +
          error.name + ": " + error.message +
          "\nCheck browser CORS or network restrictions.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
