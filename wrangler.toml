name = "juhudmanager-api"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGIN = "https://YOUR_GITHUB_USERNAME.github.io"
COOKIE_NAME = "juhud_session"
SESSION_DAYS = "7"

[[d1_databases]]
binding = "DB"
database_name = "JuhudDB"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
