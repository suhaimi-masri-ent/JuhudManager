
<section id="loginView" class="auth-layout">

  <div class="hero">

    <p class="eyebrow">PEOPLE · ACTIVITIES · PROGRESS</p>

    <h1 data-i18n="welcome">
      A clearer way to manage people and activities.
    </h1>

    <p class="muted" data-i18n="intro">
      One secure workspace for profiles, periodic updates and administrative review.
    </p>

    <div class="feature-points">
      <span>✓ <span data-i18n="feature1">Personal information</span></span>
      <span>✓ <span data-i18n="feature2">Daily to yearly activities</span></span>
      <span>✓ <span data-i18n="feature3">Review and reporting workflow</span></span>
    </div>

  </div>

  <form id="loginForm" class="panel login-panel">

    <h2 data-i18n="signIn">Sign in</h2>

    <label for="loginType" data-i18n="loginWith">
      Login using
    </label>

    <select id="loginType">
      <option value="EMAIL">Email</option>
    </select>

    <label for="loginIdentifier" data-i18n="identifier">
      Email Address
    </label>

    <input
      id="loginIdentifier"
      type="email"
      autocomplete="username"
      required
    >

    <label for="password" data-i18n="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button
      class="btn btn-primary full"
      type="submit"
      data-i18n="signIn"
    >
      Sign in
    </button>

    <p id="loginMessage" class="message" role="status"></p>

    <p class="small muted" data-i18n="accountNote">
      Accounts are created by an administrator.
    </p>

  </form>

</section>
