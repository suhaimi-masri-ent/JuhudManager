
<section id="adminPanel" class="view hidden">

  <div class="admin-grid">

    <!-- CREATE USER -->

    <div class="panel">

      <h2>Create User</h2>

      <form id="createUserForm" class="stack">

        <label>
          Full Name
          <input type="text" id="newFullName" required>
        </label>

        <label>
          Email
          <input type="email" id="newEmail" required>
        </label>

        <label>
          Password
          <input
            type="password"
            id="newPassword"
            minlength="8"
            required
          >
        </label>

        <div id="createUserMessage" class="message"></div>

        <button type="submit" class="btn btn-primary">
          Create User
        </button>

      </form>

    </div>


    <!-- CREATE ACTIVITY TYPE -->

    <div class="panel">

      <h2>Create Activity Type</h2>

      <form id="createTypeForm" class="stack">

        <label>
          Activity Name
          <input type="text" id="typeName" required>
        </label>

        <label>
          Frequency
          <select id="typeFrequency" required>
            <option value="">Select frequency</option>
            <option value="DAILY">Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="MONTHLY">Monthly</option>
            <option value="QUARTERLY">Quarterly</option>
            <option value="YEARLY">Yearly</option>
          </select>
        </label>

        <label>
          Description
          <textarea id="typeDescription" rows="3"></textarea>
        </label>

        <div id="createTypeMessage" class="message"></div>

        <button type="submit" class="btn btn-primary">
          Create Activity Type
        </button>

      </form>

    </div>

  </div>


  <!-- USER MANAGEMENT -->

  <div class="panel" style="margin-top:18px">

    <h2>User Management</h2>

    <div class="table-wrap">
      <div id="usersTable"></div>
    </div>

  </div>


  <!-- ADMIN EDIT USER PROFILE -->
  
  <dialog id="editUserProfileDialog">
    <div class="panel">
      <h2>Edit User Profile</h2>

      <form id="editUserProfileForm" class="stack">

        <h3>Personal Information</h3>

        <div class="form-grid">
          <label>
            Full Name
            <input type="text" id="adminEditFullName" required maxlength="200">
          </label>

          <label>
            Date of Birth
            <input type="date" id="adminEditDob">
          </label>

          <label>
            Gender
            <select id="adminEditGender">
              <option value="">Select</option>
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
            </select>
          </label>

          <label>
            Marital Status
            <select id="adminEditMarital">
              <option value="">Select</option>
              <option value="SINGLE">Single</option>
              <option value="MARRIED">Married</option>
              <option value="DIVORCED">Divorced</option>
              <option value="WIDOWED">Widowed</option>
            </select>
          </label>

          <label>
            Nationality
            <input type="text" id="adminEditNationality">
          </label>
        </div>

        <h3>Employment Information</h3>

        <div class="form-grid">
          <label>
            Employment Status
            <select id="adminEditEmploymentStatus">
              <option value="">Select</option>
              <option value="EMPLOYED">Employed</option>
              <option value="SELF_EMPLOYED">Self-employed</option>
              <option value="UNEMPLOYED">Unemployed</option>
              <option value="RETIRED">Retired</option>
              <option value="STUDENT">Student</option>
              <option value="OTHER">Other</option>
            </select>
          </label>

          <label>
            Employment Type
            <select id="adminEditEmploymentType">
              <option value="">Select</option>
              <option value="PERMANENT">Permanent</option>
              <option value="CONTRACT">Contract</option>
              <option value="PART_TIME">Part-time</option>
              <option value="TEMPORARY">Temporary</option>
              <option value="FREELANCE">Freelance</option>
            </select>
          </label>

          <label>
            Employment Sector
            <select id="adminEditEmploymentSector">
              <option value="">Select</option>
              <option value="GOVERNMENT">Government</option>
              <option value="PRIVATE">Private</option>
              <option value="NGO">NGO</option>
              <option value="OTHER">Other</option>
            </select>
          </label>

          <label>
            Occupation
            <input type="text" id="adminEditOccupation">
          </label>

          <label>
            Employer / Company
            <input type="text" id="adminEditEmployer">
          </label>

          <label>
            Department
            <input type="text" id="adminEditDepartment">
          </label>

          <label>
            Position / Designation
            <input type="text" id="adminEditPosition">
          </label>

          <label>
            Work Location
            <input type="text" id="adminEditWorkLocation">
          </label>
        </div>

        <h3>Address Information</h3>

        <div class="form-grid">
          <label>
            Country
            <input type="text" id="adminEditCountry">
          </label>

          <label>
            State / Province
            <input type="text" id="adminEditState">
          </label>

          <label>
            City / District
            <input type="text" id="adminEditCity">
          </label>

          <label>
            Postcode
            <input type="text" id="adminEditPostcode">
          </label>

          <label>
            Street Address
            <input type="text" id="adminEditStreet">
          </label>

          <label>
            Building Number
            <input type="text" id="adminEditBuildingNo">
          </label>

          <label>
            Building Name
            <input type="text" id="adminEditBuildingName">
          </label>

          <label>
            Address Line 2
            <input type="text" id="adminEditAddress2">
          </label>
        </div>

        <div id="adminEditProfileMessage" class="message"></div>

        <div class="row">
          <button type="submit" class="btn btn-primary">
            Save Changes
          </button>

          <button
            type="button"
            class="btn"
            id="adminEditProfileCancel"
          >
            Cancel
          </button>
        </div>

      </form>
    </div>
  </dialog>

  

  <!-- SUBMISSION REVIEW -->

  <div class="panel" style="margin-top:18px">

    <h2>Activity Submissions Review</h2>

    <div class="table-wrap">
      <div id="submissionsTable"></div>
    </div>

  </div>



  <!-- AUDIT TRAIL -->

  <div class="panel" style="margin-top:18px">

    <h2>Audit Trail</h2>

    <p>
      System activity and security audit records.
    </p>

    <div id="auditTrailMessage" class="message"></div>

    <!-- SEARCH -->
    <div class="stack">

      <label>
        Search
        <input
          type="search"
          id="auditSearch"
          placeholder="Search user, action, target or audit ID..."
        >
      </label>

      <!-- FILTERS -->
      <div class="form-grid">

        <label>
          Action
          <select id="auditActionFilter">
            <option value="">All Actions</option>
          </select>
        </label>

        <label>
          Country
          <select id="auditCountryFilter">
            <option value="">All Countries</option>
          </select>
        </label>

        <label>
          From Date
          <input type="date" id="auditDateFrom">
        </label>

        <label>
          To Date
          <input type="date" id="auditDateTo">
        </label>

        <label>
          Records Per Page
          <select id="auditPageSize">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
          </select>
        </label>

      </div>

      <div class="row">
        <button
          type="button"
          class="btn"
          id="auditResetFilters"
        >
          Reset Filters
        </button>
      </div>

    </div>

    <!-- TABLE -->
    <div class="table-wrap" style="margin-top:16px">
      <div id="auditTrailTable"></div>
    </div>

    <!-- PAGINATION -->
    <div
      id="auditPagination"
      class="row"
      style="margin-top:14px; justify-content:space-between; align-items:center"
    ></div>

  </div>

  

</section>
